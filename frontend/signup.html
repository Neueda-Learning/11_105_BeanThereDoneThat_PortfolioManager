<!DOCTYPE html>
<html lang="en">
<head>
  <title>Create Account - Portfolio Manager</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

<div class="pm-auth-page">

  <div class="pm-auth-card" style="max-width:460px;">

    <div class="pm-auth-card__top">
      <div class="pm-auth-logo">
        <i class="bi bi-graph-up-arrow"></i>
      </div>

      <div class="pm-auth-card__ttl">
        Create Account
      </div>

      <div class="pm-auth-card__sub">
        Start managing your portfolio today
      </div>
    </div>


    <div class="pm-auth-card__bd">

      <div id="signupAlert" class="pm-alert pm-alert--danger mb-3 d-none">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="signupAlertMsg">Error.</span>
      </div>


      <div id="signupSuccess" class="pm-alert pm-alert--success mb-3 d-none">
        <i class="bi bi-check-circle-fill"></i>
        Account created!
        <a href="login.html">Sign in now</a>
      </div>



      <form id="signupForm" novalidate>


        <div class="row g-3 mb-3">

          <div class="col-6">
            <label class="pm-label">
              First Name <span class="req">*</span>
            </label>

            <input 
              type="text"
              id="firstName"
              class="pm-input"
              placeholder="Jane"
              required/>
          </div>


          <div class="col-6">
            <label class="pm-label">
              Last Name <span class="req">*</span>
            </label>

            <input 
              type="text"
              id="lastName"
              class="pm-input"
              placeholder="Doe"
              required/>
          </div>

        </div>



        <div class="mb-3">

          <label class="pm-label">
            Email address <span class="req">*</span>
          </label>

          <input 
            type="email"
            id="signupEmail"
            class="pm-input"
            placeholder="you@example.com"
            required/>

        </div>




        <div class="mb-3">

          <label class="pm-label">
            Phone Number <span class="req">*</span>
          </label>

          <input 
            type="tel"
            id="phone"
            class="pm-input"
            placeholder="9876543210"
            maxlength="10"
            required/>

        </div>




        <div class="mb-4">

          <label class="pm-label">
            Password <span class="req">*</span>
          </label>

          <input 
            type="password"
            id="signupPwd"
            class="pm-input"
            placeholder="Min. 8 characters"
            minlength="8"
            required/>

        </div>



        <div class="mb-4">

          <label class="pm-label">
            Confirm Password <span class="req">*</span>
          </label>

          <input 
            type="password"
            id="confirmPwd"
            class="pm-input"
            placeholder="Repeat your password"
            required/>

        </div>




        <div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:18px;font-size:.79rem;color:var(--gray-600);">

          <input 
            type="checkbox"
            id="terms"
            required/>

          <label>
            I agree to the Terms of Service and Privacy Policy
          </label>

        </div>



        <button 
          type="submit"
          id="signupBtn"
          class="pm-btn pm-btn--primary pm-btn--full pm-btn--lg">

          <i class="bi bi-person-plus-fill"></i>
          Create Account

        </button>


      </form>



      <hr style="border-color:var(--gray-200);margin:16px 0;"/>


      <p style="text-align:center;font-size:.8rem;color:var(--gray-600);">

        Already have an account?

        <a href="login.html">
          Sign in
        </a>

      </p>


    </div>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>



<script>

redirectIfAuthenticated();



document.getElementById("signupForm")
.addEventListener("submit", async function(e){


e.preventDefault();



let alertBox=document.getElementById("signupAlert");
let success=document.getElementById("signupSuccess");
let msg=document.getElementById("signupAlertMsg");


alertBox.classList.add("d-none");
success.classList.add("d-none");



let firstName=document.getElementById("firstName").value.trim();

let lastName=document.getElementById("lastName").value.trim();

let email=document.getElementById("signupEmail").value.trim();

let phone=document.getElementById("phone").value.trim();

let password=document.getElementById("signupPwd").value;

let confirm=document.getElementById("confirmPwd").value;



if(!firstName || !lastName){

msg.textContent="Please enter your full name.";

alertBox.classList.remove("d-none");

return;

}



if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

msg.textContent="Enter a valid email address.";

alertBox.classList.remove("d-none");

return;

}



if(!/^[0-9]{10}$/.test(phone)){

msg.textContent="Phone number must contain exactly 10 digits.";

alertBox.classList.remove("d-none");

return;

}



if(password.length < 6){

msg.textContent="Password must contain minimum 6 characters.";

alertBox.classList.remove("d-none");

return;

}



if(password !== confirm){

msg.textContent="Passwords do not match.";

alertBox.classList.remove("d-none");

return;

}



if(!document.getElementById("terms").checked){

msg.textContent="Please accept terms and conditions.";

alertBox.classList.remove("d-none");

return;

}



let btn=document.getElementById("signupBtn");

btn.disabled=true;



try{


await registerCustomer({

    customerName: firstName + " " + lastName,
    username: email,
    password: password,
    email: email,
    phoneNumber: phone

});


// Automatically login after successful registration

let loginResponse = await loginCustomer({

    username: email,
    password: password

});


let customerId = loginResponse.customerId ||
    (loginResponse.data && loginResponse.data.customerId);


let customerName = loginResponse.customerName ||
    (loginResponse.data && loginResponse.data.customerName) ||
    (firstName + " " + lastName);



if (!customerId) {

    throw new Error("Registration successful but automatic login failed.");

}



// Save user session

setAuthSession(customerId, customerName);


// Redirect to application

window.location.href = "dashboard.html";
} catch (error) {

    msg.textContent = error.message || "Registration failed.";
    alertBox.classList.remove("d-none");

} finally {

    btn.disabled = false;

}
}); // End of submit event listener
//}); // End of submit event listener


</script>


</body>
</html>
