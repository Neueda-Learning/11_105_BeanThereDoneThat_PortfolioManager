<!DOCTYPE html>
<html lang="en">

<head>

<title>Sign In - Portfolio Manager</title>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="css/style.css"/>

</head>


<body>


<div class="pm-auth-page">


<div class="pm-auth-card">


<div class="pm-auth-card__top">

<div class="pm-auth-logo">
<i class="bi bi-graph-up-arrow"></i>
</div>


<div class="pm-auth-card__ttl">
Portfolio Manager
</div>


<div class="pm-auth-card__sub">
Sign in to your investment dashboard
</div>


</div>



<div class="pm-auth-card__bd">


<div id="loginAlert" class="pm-alert pm-alert--danger mb-3 d-none">

<i class="bi bi-exclamation-circle-fill"></i>

<span id="alertMsg">
Invalid credentials.
</span>

</div>




<form id="loginForm" novalidate>



<div class="mb-3">


<label class="pm-label">

Username / Email <span class="req">*</span>

</label>


<input

type="text"

id="email"

class="pm-input"

placeholder="Enter username or email"

required

autocomplete="username"/>


</div>





<div class="mb-4">


<label class="pm-label">

Password <span class="req">*</span>

</label>




<div class="pm-input-group">


<input

type="password"

id="password"

class="pm-input"

placeholder="Enter your password"

required

autocomplete="current-password"

style="border-radius:var(--r-sm) 0 0 var(--r-sm);"/>



<button

type="button"

id="togglePwd"

class="pm-icon-btn"

style="border-radius:0 var(--r-sm) var(--r-sm) 0;width:38px;height:36px;border-left:none;"

>

<i class="bi bi-eye" id="eyeIcon"></i>


</button>



</div>


</div>





<div style="display:flex;align-items:center;gap:7px;margin-bottom:18px;font-size:.79rem;color:var(--gray-600);">


<input

type="checkbox"

id="remember"

style="accent-color:var(--pink-400);width:14px;height:14px;"/>


<label>

Keep me signed in

</label>


</div>






<button

type="submit"

id="loginBtn"

class="pm-btn pm-btn--primary pm-btn--full pm-btn--lg">


<i class="bi bi-box-arrow-in-right"></i>

Sign In


</button>



</form>





<hr style="border-color:var(--gray-200);margin:16px 0;"/>




<p style="text-align:center;font-size:.8rem;color:var(--gray-600);">

No account?

<a href="signup.html" style="font-weight:700;color:var(--pink-txt);">

Create one free

</a>

</p>



<p style="text-align:center;font-size:.72rem;color:var(--gray-400);margin-top:10px;">

© 2026 Bean There Done That. All rights reserved.

</p>




</div>


</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="js/api.js"></script>

<script src="js/auth.js"></script>




<script>


redirectIfAuthenticated();





document.getElementById("togglePwd")
.addEventListener("click",function(){


let password=document.getElementById("password");

let icon=document.getElementById("eyeIcon");


if(password.type==="password"){

password.type="text";

icon.className="bi bi-eye-slash";

}

else{

password.type="password";

icon.className="bi bi-eye";

}


});







document.getElementById("loginForm")
.addEventListener("submit",async function(e){


e.preventDefault();



let username=document.getElementById("email").value.trim();

let password=document.getElementById("password").value;


let alertBox=document.getElementById("loginAlert");

let alertMsg=document.getElementById("alertMsg");


alertBox.classList.add("d-none");





if(!username || !password){


alertMsg.textContent="Please enter username and password.";

alertBox.classList.remove("d-none");

return;


}





let btn=document.getElementById("loginBtn");


btn.disabled=true;


btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';





try{


let response=await loginCustomer({

username:username,

password:password

});





let customerId=response.customerId || 
(response.data && response.data.customerId);



let customerName=response.customerName ||
(response.data && response.data.customerName) ||
username;






if(!customerId){


throw new Error("Customer ID not received from server.");


}






setAuthSession(customerId,customerName);



window.location.href="dashboard.html";





}

catch(error){


alertMsg.textContent=error.message || "Invalid username or password.";

alertBox.classList.remove("d-none");



btn.disabled=false;


btn.innerHTML='<i class="bi bi-box-arrow-in-right"></i> Sign In';


}



});



</script>


</body>

</html>
